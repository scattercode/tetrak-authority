# Lint, type-check and test on every push and pull request.
#
# The package has no runtime dependencies, so the matrix is cheap: every
# supported Python, the full test suite with the coverage floor from
# pyproject.toml, and the Sphinx build with warnings as errors so a broken
# docstring cross-reference fails here rather than at release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from `git describe --tags`; a
          # shallow clone has no tags reachable and the package would
          # report 0.1.dev1+g<sha>.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the package with the development extra
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests docs
          ruff format --check src tests docs

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing

      # The wheel, not the editable install: catches files that work from
      # `pip install -e .` but were left out of the wheel.
      - name: Build and smoke-test the wheel
        if: matrix.python == '3.12'
        run: |
          pip install --quiet build twine
          python -m build
          twine check --strict dist/*
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/tetrak-authority lookup --snapshot tests/data/snapshot "Tumanyan, Hovhannes"
          /tmp/smoke/bin/python -c "import tetrak_authority as t; print(t.__version__)"

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv.lock pins the resolved development and documentation tooling so
      # scanners see real versions, not ranges. Regenerate with `uv lock`
      # after any pyproject.toml change.
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[apidocs]'
      - run: sphinx-build -W -b html docs docs/_build/html

  # Same arrangement as Tetrak and the sibling repositories. The committed
  # uv.lock is what makes the scan worthwhile for Python: pyproject.toml
  # declares ranges, but the lock carries every resolved version.
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-source-tree
          path: sbom.cdx.json
          retention-days: 90

  # cliff.toml and .githooks/commit-msg are copies of the shared templates in
  # scattercode/release-pipelines. They have to be real files here -- git-cliff
  # reads one from the repository root and git runs the other from the checkout
  # -- so they cannot be referenced remotely the way the next-version action
  # is. This is what stops a copy drifting unnoticed.
  templates:
    name: Shared templates are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared templates
        uses: actions/checkout@v7
        with:
          repository: scattercode/release-pipelines
          ref: v1
          path: .release-pipelines

      - name: Compare
        run: ./.release-pipelines/sync.sh --check .
